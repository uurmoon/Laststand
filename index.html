<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05060a" />
<title>Ryder: Last Stand v0.3</title>
<style>
  :root {
    --bg:#05060a; --panel:#0e1320; --line:#27324a; --text:#f5f7fb; --muted:#9aa4ba;
    --gold:#f0b85a; --red:#ff506c; --blue:#5eb8ff;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin:0; width:100%; min-height:100%; background:var(--bg); color:var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow:hidden; }
  body { padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); display:flex; align-items:center; justify-content:center; }
  .shell { width:min(100%, 980px); height:100%; max-height:900px; display:flex; flex-direction:column; gap:10px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:64px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; }
  .logo { width:54px; height:54px; border:1px solid #33415f; border-radius:16px; display:flex; align-items:center; justify-content:center; background:linear-gradient(145deg,#16253d,#0d1320); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); font-weight:900; font-size:22px; letter-spacing:-2px; }
  .title { min-width:0; }
  .title h1 { margin:0; font-size: clamp(21px,4.8vw,32px); line-height:1.02; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title p { margin:3px 0 0; color:var(--muted); font-size: clamp(12px,3.4vw,16px); }
  .stats { display:flex; gap:8px; align-items:center; }
  .pill { padding:10px 14px; border:1px solid #303b55; border-radius:999px; background:linear-gradient(145deg,#141a2a,#0d111d); box-shadow: inset 0 0 0 1px rgba(255,255,255,.04); font-weight:800; white-space:nowrap; }
  .stageWrap { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  canvas { width:100%; max-width:960px; aspect-ratio:16/9; background:#0b0d14; border-radius:24px; border:1px solid #293146; box-shadow: 0 25px 90px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.035); image-rendering: pixelated; image-rendering: crisp-edges; }
  .controls { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; padding-bottom: max(6px, env(safe-area-inset-bottom)); }
  button { border:none; color:#fff; font-weight:950; font-size: clamp(18px, 4.8vw, 28px); letter-spacing:.04em; height:72px; border-radius:24px; background:linear-gradient(145deg,#151c2d,#0e1320); border:1px solid #313a52; box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.32); }
  button:active { transform: translateY(2px) scale(.99); filter:brightness(1.12); }
  .kick { background:linear-gradient(145deg,#421d2d,#22101a); border-color:#704159; }
  .punch { background:linear-gradient(145deg,#4a3d27,#211b12); border-color:#7b6842; }
  .hint { text-align:center; color:#8e96aa; font-size:13px; margin-top:-4px; }
  @media (max-height:680px) {
    .top { min-height:50px; } .logo {width:44px;height:44px;border-radius:13px;font-size:19px} .controls button, button { height:56px; border-radius:20px; } .hint {display:none;}
  }
  @media (orientation:landscape) { .shell {max-width:1180px} .top {min-height:48px} .controls {max-width:820px;margin:0 auto;width:100%;} button {height:58px;font-size:20px} }
</style>
</head>

    player.stamina -= 12; player.cd=.34; startAction(player,'punch',.22);
    if(canHit(178)) {
      enemy.hp = clamp(enemy.hp - 12,0,100); enemy.stun=.22; enemy.vel=80; startAction(enemy,'hurt',.24);
      state.score += 45; state.shake=5; state.hitStop=.045; addSpark(enemy.x+50, enemy.y-72); addFloater('-12', enemy.x+74, enemy.y-120, '#ffd36e'); addDust(enemy.x+55, groundY-6, 7);
      if(enemy.hp<=0) win();
    } else { addFloater('BOŞ', player.x+84, player.y-122, '#93a0b8'); }
    updateHtml();
  }
  function playerKick() {
    if(state.phase==='win') return;
    if(player.cd>0 || player.stamina < 26) return;
    player.stamina -= 26; player.cd=.56; startAction(player,'kick',.34);
    if(canHit(205)) {
      enemy.hp = clamp(enemy.hp - 22,0,100); enemy.stun=.38; enemy.vel=132; startAction(enemy,'hurt',.30);
      state.score += 85; state.shake=9; state.hitStop=.07; addSpark(enemy.x+46, enemy.y-92); addFloater('-22', enemy.x+74, enemy.y-128, '#ff7d95'); addDust(enemy.x+52, groundY-4, 12);
      if(enemy.hp<=0) win();
    } else { addFloater('ISKA', player.x+92, player.y-120, '#93a0b8'); }
    updateHtml();
  }
  function backstep() { if(state.phase==='win') return; player.x = clamp(player.x-28, 250, 420); player.guard=.24; startAction(player,'guard',.18); addDust(player.x+60, groundY-4, 5); }
  function enemyAttack() {
    if(enemy.dead || state.phase!=='fight') return;
    startAction(enemy,'attack',.28); enemy.cd=rand(.85,1.2);
    if(dist()<156 && player.inv<=0) {
      let dmg = player.guard>0 ? 5 : 14;
      player.hp = clamp(player.hp - dmg,0,100); player.inv=.22; state.shake = player.guard>0 ? 4 : 7; state.hitStop=.045; addSpark(player.x+100, player.y-82); addFloater('-'+dmg, player.x+78, player.y-128, player.guard>0?'#8cf0ff':'#ff637a');
      if(!player.guard) startAction(player,'hurt',.24);
      addDust(player.x+72, groundY-5, 8);
      if(player.hp<=0) { state.phase='lose'; state.message='Ryder düştü'; state.messageT=9; }
    }
  }
  function win() {
    enemy.dead=true; state.phase='win'; startAction(enemy,'fall',99); state.score += 300; state.shake=12; addDust(enemy.x+70, groundY-5, 24); addFloater('LEVEL 1 TAMAM', 455, 170, '#ffe08b'); updateHtml();
  }

  function update(dt) {
    if(state.hitStop>0) { state.hitStop-=dt; return; }
    state.t += dt;
    player.cd = Math.max(0, player.cd-dt); player.inv = Math.max(0, player.inv-dt); player.guard = Math.max(0, player.guard-dt); player.stamina = clamp(player.stamina + dt*23,0,100);
    if(player.actionT>0) { player.actionT -= dt; if(player.actionT<=0) player.action='idle'; }
    if(enemy.actionT>0 && enemy.action!=='fall') { enemy.actionT -= dt; if(enemy.actionT<=0) enemy.action='idle'; }
    state.shake = Math.max(0, state.shake - dt*28);

    if(state.phase==='fight') {
      // enemy keeps duel distance, not endless wave
      if(enemy.stun>0) { enemy.stun-=dt; enemy.x += enemy.vel*dt; enemy.vel *= Math.pow(.15, dt); }
      else {
        enemy.cd -= dt;
        const target = player.x + 148;
        const gap = enemy.x - target;
        if(gap > 20) enemy.x -= Math.min(46*dt, gap);
        if(gap < -8) enemy.x += 35*dt;
        if(enemy.cd<=0 && dist()<170) enemyAttack();
      }
      enemy.x = clamp(enemy.x, 492, 720);
      // player lightly returns to duel zone if too far, so fight doesn't stall
      if(player.x < 330 && player.guard<=0) player.x += 18*dt;
    }
    // animation frames
    player.frame = choosePlayerFrame(); enemy.frame = chooseEnemyFrame();

    // particles / floaters / spark
    for(const p of state.particles) { p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=160*dt; p.a=clamp(p.life/.55,0,1); }
    state.particles = state.particles.filter(p=>p.life>0);
    for(const f of state.floaters) { f.life-=dt; f.y+=f.vy*dt; f.a=clamp(f.life/.8,0,1); }
    state.floaters = state.floaters.filter(f=>f.life>0);
    if(state.spark) { state.spark.t+=dt; state.spark.frame=Math.min(3, Math.floor(state.spark.t/.055)); if(state.spark.t>state.spark.life) state.spark=null; }
  }
  function choosePlayerFrame() {
    if(player.action==='punch') return 3;
    if(player.action==='kick') return 4;
    if(player.action==='hurt') return 5;
    if(player.action==='guard') return 2;
    return (Math.floor(state.t*5)%2);
  }
  function chooseEnemyFrame() {
    if(enemy.action==='fall') return 4;
    if(enemy.action==='attack') return 2;
    if(enemy.action==='hurt') return 3;
    return Math.floor(state.t*4)%2;
  }

  function drawBar(x,y,w,h,val,label,mainColor) {
    ctx.save();
    ctx.fillStyle='rgba(8,10,15,.72)'; ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=2; ctx.strokeRect(x,y,w,h);
    const g=ctx.createLinearGradient(x,y,x+w,y); g.addColorStop(0, mainColor); g.addColorStop(.72,'#ffd171'); g.addColorStop(1,'#ff4f69');
    ctx.fillStyle=g; ctx.fillRect(x+3,y+3,(w-6)*clamp(val/100,0,1),h-6);
    ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='12px monospace'; ctx.fillText(label, x+4, y-5);
    ctx.restore();
  }
  function drawSprite(img, frame, x, y, w, h, flip=false) {
    ctx.save(); ctx.imageSmoothingEnabled=false;
    if(flip) { ctx.translate(x+w, y); ctx.scale(-1,1); ctx.drawImage(img, frame*96,0,96,96, 0,0,w,h); }
    else ctx.drawImage(img, frame*96,0,96,96, x,y,w,h);
    ctx.restore();
  }
  function draw() {
    ctx.save();
    ctx.clearRect(0,0,W,H);
    const sx = state.shake>0 ? rand(-state.shake,state.shake) : 0;
    const sy = state.shake>0 ? rand(-state.shake,state.shake) : 0;
    ctx.translate(sx,sy);
    ctx.imageSmoothingEnabled=false;
    // Background: low-res scaled pixel art
    ctx.drawImage(images.bg, 0,0,480,270, 0,0,W,H);
    // subtle stage vignette
    const vignette=ctx.createRadialGradient(480,260,120,480,260,620); vignette.addColorStop(0,'rgba(0,0,0,0)'); vignette.addColorStop(1,'rgba(0,0,0,.45)'); ctx.fillStyle=vignette; ctx.fillRect(0,0,W,H);
    // HUD inside canvas
    drawBar(42,34,330,19,player.hp,'RYDER','#66e59b');
    ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(42,62,180,9); ctx.fillStyle='#7bc4ff'; ctx.fillRect(45,65,174*player.stamina/100,3);
    drawBar(630,34,288,19,enemy.hp,'GRIM','#ffd066');
    ctx.fillStyle='rgba(10,12,17,.55)'; ctx.fillRect(74,120,90,28); ctx.fillStyle='#caa560'; ctx.font='bold 18px monospace'; ctx.fillText('LEVEL 1', 88,140);
    ctx.fillStyle='rgba(10,12,17,.55)'; ctx.fillRect(800,120,110,28); ctx.fillStyle='#75c4a4'; ctx.font='bold 15px monospace'; ctx.fillText('DUEL MODE', 812,140);
    // character shadows
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(player.x+22, groundY-9, 116, 12); ctx.fillRect(enemy.x+22, groundY-9, 116, 12);
    // draw sprites
    drawSprite(images.ryder, player.frame, Math.round(player.x), Math.round(groundY-player.h+4), player.w, player.h, false);
    drawSprite(images.grim, enemy.frame, Math.round(enemy.x), Math.round(groundY-enemy.h+4), enemy.w, enemy.h, false);
    // spark
    if(state.spark) ctx.drawImage(images.fx, state.spark.frame*64,0,64,64, state.spark.x-42, state.spark.y-42, 100,100);
    // particles
    for(const p of state.particles) { ctx.globalAlpha=p.a; ctx.fillStyle='rgba(191,185,172,.8)'; ctx.fillRect(Math.round(p.x),Math.round(p.y),Math.round(p.size),Math.max(2,Math.round(p.size*.35))); ctx.globalAlpha=1; }
    // floaters
    for(const f of state.floaters) { ctx.globalAlpha=f.a; ctx.font='bold 26px monospace'; ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillText(f.text, f.x+2, f.y+2); ctx.fillStyle=f.color; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha=1; }
    if(state.phase==='win') overlay('LEVEL 1 TAMAMLANDI', 'Grim indirildi. Level 2 için sonraki pakete geçeceğiz.', 'R ile yeniden başlat');
    if(state.phase==='lose') overlay('RYDER DÜŞTÜ', 'Geri çekilmeyi zamanla, tekmeyi boşa harcama.', 'R ile yeniden dene');
    ctx.restore();
  }
  function overlay(title, sub, foot) {
    ctx.fillStyle='rgba(3,5,10,.74)'; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(240,184,90,.5)'; ctx.lineWidth=2; ctx.strokeRect(282,165,396,172);
    ctx.fillStyle='rgba(14,17,25,.86)'; ctx.fillRect(288,171,384,160);
    ctx.fillStyle='#ffe09a'; ctx.font='bold 36px monospace'; ctx.textAlign='center'; ctx.fillText(title,480,222);
    ctx.fillStyle='#d5d9e3'; ctx.font='18px monospace'; ctx.fillText(sub,480,258);
    ctx.fillStyle='#8fa0bd'; ctx.font='16px monospace'; ctx.fillText(foot,480,296);
    ctx.textAlign='left';
  }
  function loop(ts) {
    const now = ts/1000; const dt = Math.min(.033, state.last ? now-state.last : .016); state.last=now;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  function bindHold(el, fn) {
    const call = (e)=>{ e.preventDefault(); fn(); };
    el.addEventListener('touchstart', call, {passive:false}); el.addEventListener('mousedown', call);
  }
  bindHold(document.getElementById('btnPunch'), playerPunch);
  bindHold(document.getElementById('btnKick'), playerKick);
  bindHold(document.getElementById('btnBack'), backstep);
  window.addEventListener('keydown', (e)=>{
    if(e.code==='KeyD') playerPunch();
    if(e.code==='Space') { e.preventDefault(); playerKick(); }
    if(e.code==='KeyA') backstep();
    if(e.code==='KeyS') { player.guard=.35; startAction(player,'guard',.22); }
    if(e.code==='KeyR') restart();
  });
  Promise.all(Object.entries(ASSETS).map(([k,v])=>loadImage(k,v))).then(()=>{ restart(); requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
