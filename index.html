function drawSprite(img,obj,isEnemy=false){const sc=2.55,dw=FW*sc,dh=FH*sc;ctx.save();ctx.translate(Math.round(obj.x),Math.round(obj.y));if(isEnemy)ctx.scale(-1,1);ctx.drawImage(img,(obj.frame||0)*FW,0,FW,FH,-dw/2,-dh+16,dw,dh);ctx.restore()}function impact(x,y,big=false){shake=big?12:7;flash=big?.22:.14;for(let i=0;i<(big?20:12);i++)sparks.push({x,y,vx:(Math.random()*2-1)*(big?5:3),vy:(Math.random()*2-1)*(big?4:3),life:.28+Math.random()*.18,big});for(let i=0;i<10;i++)dust.push({x:x-10+Math.random()*20,y:ground-3,vx:(Math.random()*2-1)*2,vy:-Math.random()*2,life:.45})}function addText(t,x,y,c='#fff'){floating.push({t,x,y,vy:-42,life:.75,c})}
function playerAttack(kind){if(!running||player.cd>0||player.stamina<(kind==='kick'?24:14))return;player.state=kind;player.frame=kind==='kick'?2:1;player.timer=kind==='kick'?.32:.24;player.cd=kind==='kick'?.45:.32;player.stamina-=kind==='kick'?24:14;const dist=Math.abs(enemy.x-player.x);if(dist<(kind==='kick'?190:150)&&!enemy.dead){let dmg=kind==='kick'?24:14;enemy.hp=Math.max(0,enemy.hp-dmg);enemy.state='hurt';enemy.frame=3;enemy.timer=.24;enemy.x+=kind==='kick'?32:20;score+=kind==='kick'?80:45;scoreEl.textContent=score;impact((player.x+enemy.x)/2,ground-142,kind==='kick');addText('-'+dmg,enemy.x,ground-180,kind==='kick'?'#ffdf74':'#fff');if(enemy.hp<=0){enemy.dead=true;enemy.frame=5;enemy.state='fall';setTimeout(()=>showOverlay('Level 1 tamamlandı','Grim indi. Level 2 için yeni rakip ve sahne açmaya hazırız kanka.','YENİDEN OYNA'),650)}}else addText('MISS',player.x+96,ground-170,'#9aa3b8')}
function back(){if(!running)return;player.block=true;player.frame=4;player.state='guard';player.timer=.28;player.x=Math.max(260,player.x-34);player.stamina=Math.min(100,player.stamina+10);dust.push({x:player.x,y:ground-3,vx:-1.8,vy:-1.2,life:.35})}document.getElementById('punchBtn').onclick=()=>playerAttack('punch');document.getElementById('kickBtn').onclick=()=>playerAttack('kick');document.getElementById('backBtn').onclick=back;window.addEventListener('keydown',e=>{if(e.key==='d'||e.key==='D')playerAttack('punch');if(e.key===' '){e.preventDefault();playerAttack('kick')}if(e.key==='a'||e.key==='A')back();if(e.key==='r'||e.key==='R')reset()});
function enemyAI(dt){if(enemy.dead)return;const dist=Math.abs(enemy.x-player.x);if(enemy.state==='hurt'||enemy.state==='fall')return;if(dist>132){enemy.x-=34*dt;enemy.frame=0}else if(enemy.cd<=0){enemy.state='punch';enemy.frame=1;enemy.timer=.28;enemy.cd=1.15;if(!player.block){player.hp=Math.max(0,player.hp-10);impact(player.x+18,ground-145,false);addText('-10',player.x,ground-180,'#ff6b7d');if(player.hp<=0)showOverlay('Ryder düştü','Level 1 tekrar denenebilir. Grim hâlâ orada, artist artist bekliyor.','TEKRAR DENE')}else{addText('BLOCK',player.x,ground-180,'#78bced');player.stamina=Math.max(0,player.stamina-8)}}}
function update(dt){if(!running)return;if(player.cd>0)player.cd-=dt;if(enemy.cd>0)enemy.cd-=dt;player.stamina=Math.min(100,player.stamina+18*dt);if(player.timer>0){player.timer-=dt;if(player.timer<=0){player.frame=0;player.state='idle';player.block=false}}if(enemy.timer>0){enemy.timer-=dt;if(enemy.timer<=0&&!enemy.dead){enemy.frame=0;enemy.state='idle'}}enemyAI(dt);if(shake>0)shake=Math.max(0,shake-55*dt);if(flash>0)flash=Math.max(0,flash-dt);floating=floating.filter(o=>(o.life-=dt)>0);floating.forEach(o=>o.y+=o.vy*dt);sparks=sparks.filter(s=>(s.life-=dt)>0);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.18});dust=dust.filter(s=>(s.life-=dt)>0);dust.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.1})}
function drawFX(){dust.forEach(s=>{ctx.fillStyle='rgba(205,198,180,'+Math.max(0,s.life*1.7)+')';ctx.fillRect(s.x,s.y,10,3)});sparks.forEach(s=>{ctx.fillStyle=s.big?'#ffe08a':'#fff';ctx.fillRect(s.x,s.y,s.big?8:5,3)});floating.forEach(o=>{ctx.globalAlpha=Math.max(0,o.life/.75);ctx.fillStyle=o.c;ctx.font='bold 26px monospace';ctx.fillText(o.t,o.x-22,o.y);ctx.globalAlpha=1})}function render(){ctx.save();const sx=shake?(Math.random()*2-1)*shake:0,sy=shake?(Math.random()*2-1)*shake:0;ctx.translate(sx,sy);drawBg();drawBars();drawSprite(ryderImg,player,false);drawSprite(grimImg,enemy,true);drawFX();if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H)}ctx.restore()}function loop(t){let dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop)
</script></body></html>
