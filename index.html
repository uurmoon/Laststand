<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#08090d" />
<title>Ryder: Last Stand — v0.2 Level 1 Duel</title>
<style>
  :root{
    --bg:#08090d; --panel:#121621; --panel2:#1a2030; --text:#eef3ff; --muted:#8c94a8;
    --accent:#ffcf5a; --danger:#ff4e6b; --good:#5ff0a4; --line:#2a3144;
    --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);}
  body{padding:calc(8px + var(--safe-top)) 10px calc(10px + var(--safe-bottom));display:flex;align-items:center;justify-content:center;}
  #wrap{width:min(100%,1080px);height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:10px;}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 0;}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .badge{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#1d2c44,#11151f);border:1px solid #33415f;display:grid;place-items:center;font-weight:900;letter-spacing:-1px;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .title{min-width:0;line-height:1.05;}
  .title b{font-size:18px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis;}
  .title span{font-size:12px;color:var(--muted);}
  .hudPills{display:flex;gap:8px;align-items:center;}
  .pill{font-size:12px;font-weight:800;color:#f8fbff;border:1px solid #30384c;background:rgba(18,22,33,.78);padding:8px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025);white-space:nowrap;}
  #stageShell{width:100%;display:flex;align-items:center;justify-content:center;min-height:0;}
  canvas{width:100%;max-height:100%;aspect-ratio:16/9;border-radius:22px;background:#151820;border:1px solid #283044;box-shadow:0 22px 70px rgba(0,0,0,.55);image-rendering:pixelated;image-rendering:crisp-edges;}
  #controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 2px;}
  button{border:0;color:#fff;font-weight:950;font-size:16px;letter-spacing:.4px;border-radius:22px;min-height:62px;background:linear-gradient(180deg,#1b2232,#111622);border:1px solid #31394e;box-shadow:0 10px 26px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.08);}
  button:active,.pressed{transform:translateY(2px);filter:brightness(1.15);}
  #btnPunch{background:linear-gradient(180deg,#3a3328,#211b15);border-color:#67563a;}
  #btnKick{background:linear-gradient(180deg,#3c2630,#20141a);border-color:#694152;}
  .smallHelp{text-align:center;color:var(--muted);font-size:12px;margin-top:-3px;}
  @media (orientation:landscape){
    #wrap{grid-template-rows:auto 1fr auto;max-height:100%;}
    header{padding-top:2px}.title b{font-size:16px}.badge{width:38px;height:38px;border-radius:12px}.pill{font-size:11px;padding:7px 9px}
    button{min-height:48px;border-radius:18px;font-size:14px}.smallHelp{display:none}
  }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="brand">
      <div class="badge">RX</div>
      <div class="title"><b>Ryder: Last Stand</b><span>v0.2 Level 1 — Duel Prototype</span></div>
    </div>
    <div class="hudPills">
      <div class="pill" id="levelPill">Level 1</div>
      <div class="pill" id="scorePill">Skor: 0</div>
      <div class="pill" id="statePill">Rakip: Grim</div>
    </div>
  </header>
  <div id="stageShell"><canvas id="game" width="960" height="540"></canvas></div>
  <div>
    <div id="controls">
      <button id="btnBack">◀ GERİ ÇEKİL</button>
      <button id="btnPunch">YUMRUK</button>
      <button id="btnKick">TEKME ▶</button>
    </div>
    <div class="smallHelp">Klavye: A geri • S korun • D yumruk • Space tekme • R yeniden başlat</div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha:false });
  ctx.imageSmoothingEnabled = false;

  const W = canvas.width, H = canvas.height;
  const floorY = 424;
  const levelPill = document.getElementById('levelPill');
  const scorePill = document.getElementById('scorePill');
  const statePill = document.getElementById('statePill');

  const keys = new Set();
  const particles = [];
  const texts = [];
  let last = performance.now();
  let t = 0;
  let hitStop = 0;
  let screenShake = 0;
  let score = Number(localStorage.getItem('ryderLastStandScoreV02') || 0);
  let state = 'intro'; // intro, playing, victory, defeat
  let introTimer = 1.4;

  const player = {
    name:'Ryder', x:335, y:floorY, vx:0, hp:100, maxHp:100, stamina:100,
    facing:1, action:'idle', actionT:0, cdPunch:0, cdKick:0, block:false,
    combo:0, comboT:0, hurtT:0, wins:0
  };
  const enemy = {
    name:'Grim', x:640, y:floorY, vx:0, hp:130, maxHp:130, stamina:100,
    facing:-1, action:'idle', actionT:0, aiT:0, cdAttack:1.1, hurtT:0, phase:1, dead:false
  };

  function resetGame(){
    score = 0;
    localStorage.setItem('ryderLastStandScoreV02', score);
    Object.assign(player,{x:335,vx:0,hp:100,stamina:100,action:'idle',actionT:0,cdPunch:0,cdKick:0,block:false,combo:0,comboT:0,hurtT:0,wins:0});
    Object.assign(enemy,{x:640,vx:0,hp:130,stamina:100,action:'idle',actionT:0,aiT:0,cdAttack:1.1,hurtT:0,phase:1,dead:false});
    particles.length = 0; texts.length = 0; state='intro'; introTimer=1.25; screenShake=0; hitStop=0;
  }

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function dist(){ return Math.abs(enemy.x - player.x); }
  function addText(txt,x,y,color='#fff',size=18){ texts.push({txt,x,y,vy:-34,life:.85,color,size}); }
  function spark(x,y,dir,color='#ffcf5a',count=16){
    for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()*120+40)*dir + (Math.random()-.5)*70,vy:(Math.random()-.65)*150,life:.35+Math.random()*.3,color,s:2+Math.random()*3});
  }
  function dust(x,y,count=10){
    for(let i=0;i<count;i++) particles.push({x:x+(Math.random()-.5)*36,y:y+Math.random()*8,vx:(Math.random()-.5)*65,vy:-20-Math.random()*35,life:.45,color:'rgba(190,184,172,.45)',s:2+Math.random()*5});
  }

  function startPunch(){
    if(state==='victory'){ resetGame(); return; }
    if(state==='defeat'){ resetGame(); return; }
    if(state!=='playing' || player.cdPunch>0 || player.stamina<10) return;
    player.action='punch'; player.actionT=.24; player.cdPunch=.34; player.stamina-=10; player.block=false;
    const range = 78;
    const facingOk = player.facing === Math.sign(enemy.x-player.x) || dist()<40;
    if(dist()<range && facingOk && !enemy.dead){
      const dmg = 12 + Math.min(10, player.combo*2);
      damageEnemy(dmg, 'YUMRUK');
    } else {
      whoosh(player.x+player.facing*42, player.y-72, player.facing);
    }
  }
  function startKick(){
    if(state==='victory'){ resetGame(); return; }
    if(state==='defeat'){ resetGame(); return; }
    if(state!=='playing' || player.cdKick>0 || player.stamina<22) return;
    player.action='kick'; player.actionT=.36; player.cdKick=.58; player.stamina-=22; player.block=false;
    const range = 104;
    const facingOk = player.facing === Math.sign(enemy.x-player.x) || dist()<40;
    if(dist()<range && facingOk && !enemy.dead){
      damageEnemy(20 + Math.min(12, player.combo*2), 'TEKME');
      enemy.vx += player.facing * 145;
      dust(enemy.x, floorY, 8);
    } else {
      whoosh(player.x+player.facing*52, player.y-54, player.facing);
    }
  }
  function startBack(){
    if(state!=='playing') return;
    player.vx = -player.facing * 210;
    player.action='dash'; player.actionT=.22;
    player.block=true;
    dust(player.x, floorY, 7);
  }
  function startBlock(on){
    if(state==='playing') player.block=on;
  }

  function damageEnemy(dmg,label){
    enemy.hp = clamp(enemy.hp - dmg, 0, enemy.maxHp);
    enemy.hurtT = .22; enemy.action='hurt'; enemy.actionT=.24;
    hitStop = .055; screenShake = 9;
    const dir = Math.sign(enemy.x-player.x) || 1;
    enemy.vx += dir * 110;
    player.combo++; player.comboT=1.25;
    score += dmg * 10 + player.combo * 15;
    localStorage.setItem('ryderLastStandScoreV02', score);
    addText('-'+dmg, enemy.x+dir*10, enemy.y-118, '#ffcf5a', 20);
    if(player.combo>1) addText(player.combo+'x', player.x, player.y-142, '#7df7b2', 16);
    spark(enemy.x-dir*20, enemy.y-82, dir, '#ffd36c', 18);
    if(enemy.hp<=0) finishEnemy();
  }
  function damagePlayer(dmg,label){
    const blocked = player.block || player.action==='dash';
    const final = blocked ? Math.ceil(dmg*.35) : dmg;
    player.hp = clamp(player.hp - final, 0, player.maxHp);
    player.hurtT = .25; player.action = blocked ? 'block' : 'hurt'; player.actionT=.22;
    hitStop=.05; screenShake = blocked ? 4 : 8;
    const dir = Math.sign(player.x-enemy.x) || -1;
    player.vx += dir * (blocked ? 55 : 120);
    addText(blocked ? 'BLOK -'+final : '-'+final, player.x-10, player.y-122, blocked?'#80d7ff':'#ff6380', 17);
    spark(player.x+dir*16, player.y-78, dir, blocked?'#80d7ff':'#ff6b82', blocked?8:14);
    player.combo=0; player.comboT=0;
    if(player.hp<=0){ state='defeat'; statePill.textContent='Yıkıldın'; addText('RYDER DÜŞTÜ', W/2-70, 180, '#ff6380', 24); }
  }
  function finishEnemy(){
    enemy.dead=true; enemy.action='ko'; enemy.actionT=999;
    score += 1500 + Math.round(player.hp)*20;
    localStorage.setItem('ryderLastStandScoreV02', score);
    player.wins=1;
    state='victory'; statePill.textContent='Level 1 temiz';
    screenShake=13; hitStop=.12;
    addText('LEVEL 1 TEMİZLENDİ', W/2-118, 168, '#7df7b2', 25);
    for(let i=0;i<30;i++) spark(enemy.x, enemy.y-70, Math.random()<.5?-1:1, i%2?'#7df7b2':'#ffcf5a', 1);
  }
  function whoosh(x,y,dir){
    for(let i=0;i<7;i++) particles.push({x:x+i*dir*5,y:y+(Math.random()-.5)*18,vx:dir*(40+Math.random()*35),vy:(Math.random()-.5)*20,life:.18,color:'rgba(255,255,255,.42)',s:2});
  }

  function update(dt){
    if(hitStop>0){ hitStop -= dt; return; }
    t += dt;
    if(state==='intro'){
      introTimer -= dt;
      if(introTimer<=0){ state='playing'; statePill.textContent='Rakip: Grim'; }
    }
    if(state==='playing'){
      player.facing = enemy.x>=player.x ? 1 : -1;
      enemy.facing = -player.facing;
      player.cdPunch = Math.max(0, player.cdPunch-dt);
      player.cdKick = Math.max(0, player.cdKick-dt);
      player.actionT = Math.max(0, player.actionT-dt);
      enemy.actionT = Math.max(0, enemy.actionT-dt);
      player.hurtT = Math.max(0, player.hurtT-dt);
      enemy.hurtT = Math.max(0, enemy.hurtT-dt);
      player.stamina = clamp(player.stamina + dt*24, 0, 100);
      if(player.comboT>0){ player.comboT-=dt; if(player.comboT<=0) player.combo=0; }
      if(player.actionT<=0 && player.action!=='idle') player.action = player.block ? 'block' : 'idle';
      if(enemy.actionT<=0 && !enemy.dead && (enemy.action==='hurt'||enemy.action==='attack')) enemy.action='idle';
      updateAI(dt);
    }
    // physics even during victory for KO slide
    player.x += player.vx*dt; enemy.x += enemy.vx*dt;
    player.vx *= Math.pow(.08,dt); enemy.vx *= Math.pow(.06,dt);
    player.x = clamp(player.x, 170, 520); enemy.x = clamp(enemy.x, 430, 815);
    screenShake = Math.max(0, screenShake - dt*28);
    updateFX(dt);
    scorePill.textContent = 'Skor: '+Math.floor(score);
    levelPill.textContent = 'Level 1';
  }
  function updateAI(dt){
    if(enemy.dead) return;
    enemy.cdAttack -= dt;
    const d = dist();
    const enraged = enemy.hp < enemy.maxHp*.45;
    enemy.phase = enraged ? 2 : 1;
    if(enemy.hurtT>0) return;
    if(d>72){
      enemy.vx += enemy.facing * (enraged?135:105) * dt;
      enemy.action='walk';
    } else {
      if(enemy.cdAttack<=0){
        enemy.action='attack'; enemy.actionT=.31;
        enemy.cdAttack = enraged ? .74 + Math.random()*.35 : 1.05 + Math.random()*.55;
        setTimeout(()=>{
          if(state==='playing' && enemy.action==='attack' && dist()<92 && !enemy.dead){
            damagePlayer(enraged?17:13,'VURDU');
          }
        }, 150);
      } else if(enemy.action!=='attack') enemy.action='idle';
    }
  }
  function updateFX(dt){
    for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=180*dt; if(p.life<=0) particles.splice(i,1); }
    for(let i=texts.length-1;i>=0;i--){ const f=texts[i]; f.life-=dt; f.x+=0; f.y+=f.vy*dt; f.vy+=24*dt; if(f.life<=0) texts.splice(i,1); }
  }

  function draw(){
    const sx = screenShake ? (Math.random()-.5)*screenShake : 0;
    const sy = screenShake ? (Math.random()-.5)*screenShake : 0;
    ctx.save(); ctx.translate(sx,sy);
    drawBackground();
    drawHudBars();
    drawShadow(player.x, floorY, 46, .42);
    drawShadow(enemy.x, floorY, enemy.dead?70:48, enemy.dead?.32:.40);
    if(player.x < enemy.x){ drawRyder(player); drawEnemy(enemy); } else { drawEnemy(enemy); drawRyder(player); }
    drawFX();
    drawOverlays();
    ctx.restore();
  }

  function rect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
  function drawBackground(){
    // sky/wall
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#11131b'); g.addColorStop(.44,'#272924'); g.addColorStop(.45,'#7e7b72'); g.addColorStop(.70,'#8b817c'); g.addColorStop(.71,'#2a2a2b'); g.addColorStop(1,'#15161b');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    // wall grain deterministic
    for(let i=0;i<520;i++){
      const x=(i*73)%W, y=170+((i*37)%125); const a=.045+((i%7)*.01);
      rect(x,y,2+((i*5)%8),2,'rgba(70,55,50,'+a+')');
    }
    // floor bands
    rect(0, floorY-70, W, 4, 'rgba(255,255,255,.10)');
    rect(0, floorY, W, H-floorY, '#202027');
    rect(0, floorY+2, W, 6, 'rgba(255,255,255,.06)');
    for(let x=-40;x<W+80;x+=70){ rect(x, floorY+52, 95, 3, 'rgba(255,255,255,.09)'); rect(x+25, floorY+96, 60, 3, 'rgba(255,255,255,.07)'); }
    for(let x=-80;x<W+100;x+=74){
      ctx.strokeStyle='rgba(80,95,115,.25)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(x,floorY); ctx.lineTo(x+58,H); ctx.stroke();
    }
    for(let y=floorY+34;y<H;y+=38){ rect(0,y,W,2,'rgba(70,85,105,.22)'); }
    // distant signs
    ctx.globalAlpha=.35; rect(88,115,86,36,'#0d1018'); rect(790,98,105,40,'#0d1018'); ctx.globalAlpha=1;
    ctx.font='bold 15px monospace'; ctx.fillStyle='rgba(255,207,90,.35)'; ctx.fillText('LEVEL 1',102,139); ctx.fillStyle='rgba(125,247,178,.30)'; ctx.fillText('DOCK',819,123);
  }
  function drawHudBars(){
    drawBar(34,26,360,16,player.hp/player.maxHp,'#5ff0a4','#ff4e6b','RYDER');
    drawBar(W-394,26,360,16,enemy.hp/enemy.maxHp,'#ffcf5a','#ff4e6b','GRIM');
    drawBar(34,50,160,8,player.stamina/100,'#80d7ff','#3d4860','STAMINA',true);
  }
  function drawBar(x,y,w,h,p,c1,c2,label,small){
    p=clamp(p,0,1); rect(x,y,w,h,'rgba(0,0,0,.45)'); rect(x+2,y+2,w-4,h-4,'#161a24');
    const grad=ctx.createLinearGradient(x,0,x+w,0); grad.addColorStop(0,c1); grad.addColorStop(1,c2); ctx.fillStyle=grad; ctx.fillRect(x+2,y+2,(w-4)*p,h-4);
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.strokeRect(x+.5,y+.5,w,h);
    ctx.font=(small?'9':'11')+'px system-ui'; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.fillText(label,x+6,y-4);
  }
  function drawShadow(x,y,w,a){ ctx.fillStyle='rgba(0,0,0,'+a+')'; ctx.fillRect(Math.round(x-w/2),Math.round(y-6),Math.round(w),10); }

  function drawRyder(o){
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(o.facing,1);
    const walkBob = o.action==='walk'?Math.sin(t*14)*2:0;
    const hurt = o.hurtT>0?Math.sin(t*80)*3:0;
    const punch = o.action==='punch'; const kick = o.action==='kick'; const block = o.block||o.action==='block'; const dash = o.action==='dash';
    // legs
    rect(-11+hurt, -69+walkBob, 10, 67, '#0b1322'); rect(5+hurt, -68-walkBob, 11, 67, '#111b2d');
    rect(-15+hurt, -5, 18, 6, '#dfe8ed'); rect(2+hurt, -4, 21, 6, '#dfe8ed');
    // coat/cape
    rect(-23+hurt, -130, 18, 73, '#151a22'); rect(-28+hurt, -88, 18, 36, '#11151d');
    // torso
    rect(-15+hurt, -127, 34, 58, '#14335d'); rect(-8+hurt, -126, 9, 58, '#2a5fa5'); rect(17+hurt, -118, 10, 38, '#101724');
    rect(-15+hurt, -131, 38, 9, '#203d6b');
    // head hair
    rect(-12+hurt, -164, 28, 28, '#e6aa76'); rect(-15+hurt, -168, 31, 11, '#17233a'); rect(8+hurt, -158, 14, 6, '#10131c');
    rect(13+hurt, -151, 5, 7, '#0a0c12');
    // arms / poses
    if(punch){
      rect(15, -116, 26, 9, '#e6aa76'); rect(39,-116,18,9,'#e6aa76'); rect(56,-118,10,10,'#ffe0aa');
      rect(-26, -117, 12, 37, '#e6aa76');
    } else if(kick){
      rect(4, -72, 48, 12, '#101b30'); rect(50,-66,23,7,'#dfe8ed');
      rect(18,-113,16,9,'#e6aa76'); rect(-26,-115,12,39,'#e6aa76');
    } else if(block){
      rect(18,-127,13,49,'#e6aa76'); rect(22,-138,12,22,'#1b2843'); rect(-28,-119,12,38,'#e6aa76');
    } else {
      rect(20,-119,12,42,'#e6aa76'); rect(-26,-117,12,39,'#e6aa76');
      rect(24,-82,15,11,'#101724');
    }
    if(dash){ rect(-38,-72,28,5,'rgba(128,215,255,.35)'); rect(-45,-58,20,4,'rgba(128,215,255,.25)'); }
    ctx.restore();
  }

  function drawEnemy(o){
    ctx.save(); ctx.translate(o.x,o.y); ctx.scale(o.facing,1);
    const hurt = o.hurtT>0?Math.sin(t*70)*4:0;
    if(o.dead){
      ctx.rotate(-0.18);
      rect(-45, -35, 92, 17, '#07101b'); rect(10,-48,34,18,'#e3a173'); rect(-58,-26,45,13,'#0b1018'); rect(35,-21,38,12,'#0b1018');
      rect(-7,-55,70,32,'#091522'); rect(22,-72,22,20,'#5a2b2f'); rect(38,-78,20,13,'#2b1719');
      ctx.restore(); return;
    }
    const attacking = o.action==='attack';
    const walkBob = o.action==='walk'?Math.sin(t*12)*2:0;
    // legs suit
    rect(-15+hurt, -67+walkBob, 12, 66, '#050a12'); rect(7+hurt, -67-walkBob, 12, 66, '#050a12');
    rect(-20+hurt,-4,22,6,'#e8e8e2'); rect(4+hurt,-4,24,6,'#e8e8e2');
    // torso suit
    rect(-26+hurt, -132, 49, 62, '#07111d'); rect(-9+hurt,-128,12,35,'#d8e2ef'); rect(1+hurt,-128,16,52,'#0a1726');
    // head / hair
    rect(-14+hurt, -162, 28, 28, '#d4986c'); rect(-21+hurt, -166, 35, 14, '#351a1a'); rect(8+hurt,-154,8,6,'#120a0a');
    // arms
    if(attacking){
      rect(18, -122, 28, 10, '#07111d'); rect(43,-125,18,9,'#d4986c'); rect(-31,-120,12,40,'#07111d');
    } else if(o.action==='hurt'){
      rect(21, -130, 12, 36, '#07111d'); rect(-40,-128,32,10,'#07111d'); rect(-45,-130,14,9,'#d4986c');
    } else {
      rect(22, -121, 12, 43, '#07111d'); rect(-35,-119,12,42,'#07111d');
    }
    if(o.phase===2){ rect(-30,-136,5,54,'rgba(255,78,107,.45)'); rect(27,-136,5,54,'rgba(255,78,107,.35)'); }
    ctx.restore();
  }

  function drawFX(){
    for(const p of particles){ ctx.globalAlpha=clamp(p.life*2.5,0,1); rect(p.x,p.y,p.s,p.s,p.color); }
    ctx.globalAlpha=1;
    for(const f of texts){ ctx.globalAlpha=clamp(f.life*1.8,0,1); ctx.font='900 '+f.size+'px system-ui'; ctx.fillStyle=f.color; ctx.fillText(f.txt,f.x,f.y); }
    ctx.globalAlpha=1;
  }
  function drawOverlays(){
    if(state==='intro'){
      overlayPanel('LEVEL 1', 'Grim tek rakip. Onu indir, bölümü temizle.', 'YUMRUK / TEKME / GERİ ÇEKİL', '#ffcf5a');
    }
    if(state==='victory'){
      overlayPanel('LEVEL 1 TAMAM', 'Rakip indirildi. Level 2 sistemi sonraki pakette açılacak.', 'Devam etmek için herhangi bir saldırı butonuna bas', '#7df7b2');
    }
    if(state==='defeat'){
      overlayPanel('RYDER DÜŞTÜ', 'Grim seni paketledi kanka. Tekrar dene.', 'Yeniden başlatmak için saldırı butonuna bas veya R', '#ff6380');
    }
  }
  function overlayPanel(a,b,c,color){
    ctx.fillStyle='rgba(5,7,12,.56)'; ctx.fillRect(0,0,W,H);
    const x=180,y=120,w=600,h=160; rect(x,y,w,h,'rgba(18,22,33,.94)');
    ctx.strokeStyle='rgba(255,255,255,.12)'; ctx.lineWidth=2; ctx.strokeRect(x+.5,y+.5,w,h);
    ctx.font='950 34px system-ui'; ctx.fillStyle=color; ctx.fillText(a,x+34,y+58);
    ctx.font='700 18px system-ui'; ctx.fillStyle='#eef3ff'; ctx.fillText(b,x+34,y+96);
    ctx.font='700 14px system-ui'; ctx.fillStyle='rgba(238,243,255,.65)'; ctx.fillText(c,x+34,y+130);
  }

  function loop(now){
    const dt = Math.min(.033,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop);
  }

  function bindButton(id, down, up){
    const b=document.getElementById(id);
    const onDown=e=>{e.preventDefault(); b.classList.add('pressed'); down&&down();};
    const onUp=e=>{e.preventDefault(); b.classList.remove('pressed'); up&&up();};
    b.addEventListener('pointerdown',onDown,{passive:false});
    b.addEventListener('pointerup',onUp,{passive:false});
    b.addEventListener('pointercancel',onUp,{passive:false});
    b.addEventListener('pointerleave',onUp,{passive:false});
  }
  bindButton('btnPunch', startPunch);
  bindButton('btnKick', startKick);
  bindButton('btnBack', startBack, ()=>{player.block=false;});

  window.addEventListener('keydown', e=>{
    if(e.repeat) return;
    if(e.code==='KeyD') startPunch();
    if(e.code==='Space'){ e.preventDefault(); startKick(); }
    if(e.code==='KeyA') startBack();
    if(e.code==='KeyS') startBlock(true);
    if(e.code==='KeyR') resetGame();
  });
  window.addEventListener('keyup', e=>{ if(e.code==='KeyS') startBlock(false); if(e.code==='KeyA') player.block=false; });
  document.addEventListener('gesturestart', e=>e.preventDefault());
  resetGame(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
